spring.application.name=backend

server.port=${PORT:8081}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/prep_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# JWT Secret (configured via environment variable in production)
jwt.secret=${JWT_SECRET:}

# Gemini API Key (configured via environment variable in production)
gemini.api.key=${GEMINI_API_KEY:}

# Google OAuth Client ID
google.client-id=${GOOGLE_CLIENT_ID:776270035755-ge6mg64nbafmfc1vabsd2a07n1gen4tg.apps.googleusercontent.com}

# Frontend URL
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# Spring Boot Mail Configuration (Configurable via Render / production environment variables)
spring.mail.host=${SPRING_MAIL_HOST:${MAIL_HOST:}}
spring.mail.port=${SPRING_MAIL_PORT:${MAIL_PORT:587}}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:${MAIL_APP_PASSWORD:}}}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
